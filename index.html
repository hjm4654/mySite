<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환영합니다</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #f5f3ff);
      padding: 16px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h1 { margin: 0 0 24px; font-size: 1.5rem; color: #1e293b; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }
    input:focus { outline: 2px solid #6366f1; border-color: transparent; }
    button {
      padding: 12px 18px;
      font-size: 1rem;
      color: #fff;
      background: #6366f1;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #4f46e5; }
    #greeting {
      margin-top: 28px;
      font-size: 1.25rem;
      font-weight: 600;
      color: #4338ca;
      min-height: 1.5em;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>이름을 입력해주세요</h1>
    <form id="nameForm">
      <input type="text" id="nameInput" placeholder="이름" autocomplete="name" required>
      <button type="submit">확인</button>
    </form>
    <p id="greeting"></p>
  </main>

  <script>
    document.getElementById('nameForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('nameInput').value.trim();
      document.getElementById('greeting').textContent =
        name ? `${name} 님 어서오세요` : '';
    });
  </script>
</body>
</html>
